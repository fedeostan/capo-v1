name: CI

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  build:
    name: Lint & Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7

      - name: Setup pnpm
        uses: pnpm/action-setup@a7487c7e89a18df4991f7f222e4898a00d66ddda # v4
        # version comes from packageManager in package.json

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: "22"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint, typecheck, build (workspace)
        run: pnpm turbo lint typecheck build

      # Deterministic, credential-free correctness check of the plan scheduler
      # and the Portuguese working-day calendar. The credentialed gates
      # (pnpm rls-matrix, pnpm agent-smoke) still have to be run by hand —
      # this is the slice that can run on every PR.
      - name: Scheduler & calendar check
        run: pnpm scheduler-check

      # Same idea for the WhatsApp channel: approval-card delivery, ordering,
      # markdown conversion, the button-id codec and Meta's payload limits are
      # all pure functions, so they can be asserted without credentials.
      - name: WhatsApp channel check
        run: pnpm whatsapp-check
