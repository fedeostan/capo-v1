name: CI

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  build:
    name: Lint & Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7

      - name: Setup pnpm
        uses: pnpm/action-setup@a7487c7e89a18df4991f7f222e4898a00d66ddda # v4
        # version comes from packageManager in package.json

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: "22"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint, typecheck, build (workspace)
        run: pnpm turbo lint typecheck build

      # Deterministic, credential-free correctness check of the plan scheduler,
      # the Portuguese working-day calendar, and the cron send window — the
      # Lisbon hours in which the two daily WhatsApp sends are still allowed
      # out, together with the UTC entries in apps/web/vercel.json that feed
      # them. The credentialed gates (pnpm rls-matrix, pnpm agent-smoke) still
      # have to be run by hand — this is the slice that can run on every PR.
      - name: Scheduler & calendar check
        run: pnpm scheduler-check

      # The write-authorization guard: whether an instruction to Capo changes
      # the real board immediately or waits behind an approval card. Pure, no
      # credentials, and every regression it covers is silent — a posture that
      # stopped being honoured writes to a live job without asking, and a broken
      # quote match just turns every direct write into friction. Added with the
      # confirmation posture (issues #57 / #64).
      - name: Guard check
        run: pnpm guard-check

      # Same idea for the WhatsApp channel: approval-card delivery, ordering,
      # markdown conversion, the button-id codec and Meta's payload limits are
      # all pure functions, so they can be asserted without credentials.
      - name: WhatsApp channel check
        run: pnpm whatsapp-check

      # And for Web Push: status classification and the stamp/retry decision
      # are pure functions, and both failure modes they guard are silent in
      # production — a dead registration retried forever, or a row that hangs
      # in the queue and re-sweeps for the rest of its life.
      - name: Push rules check
        run: pnpm push-check

      # Provider prompt caching (issue #58). The one optimisation in the repo
      # that fails silently in BOTH directions: a breakpoint in the wrong place
      # bills 25% more instead of 90% less, and a breakpoint that stops being
      # emitted just makes the product quietly more expensive. This asserts the
      # split is byte-identical to the prompt we used to send, that the cut sits
      # above the daily date line, and — driving the real provider against a
      # stubbed fetch — that cache_control lands on the wire where we think.
      - name: Prompt caching check
        run: pnpm cache-check

      # The token ledger and the rate card (issue #53). Its headline failure is
      # the quietest in the repo: reading `inputTokens.total` instead of
      # `.noCache` double-bills every cached prompt token, producing a cost
      # report that is plausible, too high, and impossible to falsify by
      # looking. It also pins the surface list against migration 0032's CHECK
      # constraint, and refuses a model with no price (which would otherwise
      # make the whole bill appear to fall).
      - name: Cost ledger check
        run: pnpm cost-check

      # The trial hand-off to Stripe (issue #85). Pure, credential-free, and
      # the bug it guards is invisible until a real manager subscribes near the
      # end of their trial: Stripe rejects an entire Checkout Session whose
      # trial_end is nearer than 48 hours, so they get an error instead of a
      # payment page. Nothing in the type system prevents it — trial_end is
      # just a number.
      - name: Billing trial check
        run: pnpm billing-check
