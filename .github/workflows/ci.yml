name: CI

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  build:
    name: Lint & Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7

      - name: Setup pnpm
        uses: pnpm/action-setup@a7487c7e89a18df4991f7f222e4898a00d66ddda # v4
        # version comes from packageManager in package.json

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: "22"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint, typecheck, build (workspace)
        run: pnpm turbo lint typecheck build

      # Deterministic, credential-free correctness check of the plan scheduler,
      # the Portuguese working-day calendar, and the cron send window — the
      # Lisbon hours in which the two daily WhatsApp sends are still allowed
      # out, together with the UTC entries in apps/web/vercel.json that feed
      # them. The credentialed gates (pnpm rls-matrix, pnpm agent-smoke) still
      # have to be run by hand — this is the slice that can run on every PR.
      - name: Scheduler & calendar check
        run: pnpm scheduler-check

      # The write-authorization guard: whether an instruction to Capo changes
      # the real board immediately or waits behind an approval card. Pure, no
      # credentials, and every regression it covers is silent — a posture that
      # stopped being honoured writes to a live job without asking, and a broken
      # quote match just turns every direct write into friction. Added with the
      # confirmation posture (issues #57 / #64).
      - name: Guard check
        run: pnpm guard-check

      # Same idea for the WhatsApp channel: approval-card delivery, ordering,
      # markdown conversion, the button-id codec and Meta's payload limits are
      # all pure functions, so they can be asserted without credentials.
      - name: WhatsApp channel check
        run: pnpm whatsapp-check

      # Tone, statically. Capo was imitating the prose of its own instruction
      # files, which carried forty em dashes in the orchestration policy alone,
      # so the loudest machine tell in the product was coming from the document
      # meant to prevent it. This keeps every model-facing file at zero and
      # ratchets the copy catalogs down. Pure file reads, so no credentials.
      - name: Voice check
        run: pnpm voice-check

      # And for Web Push: status classification and the stamp/retry decision
      # are pure functions, and both failure modes they guard are silent in
      # production — a dead registration retried forever, or a row that hangs
      # in the queue and re-sweeps for the rest of its life.
      - name: Push rules check
        run: pnpm push-check

      # Provider prompt caching (issue #58). The one optimisation in the repo
      # that fails silently in BOTH directions: a breakpoint in the wrong place
      # bills 25% more instead of 90% less, and a breakpoint that stops being
      # emitted just makes the product quietly more expensive. This asserts the
      # split is byte-identical to the prompt we used to send, that the cut sits
      # above the daily date line, and — driving the real provider against a
      # stubbed fetch — that cache_control lands on the wire where we think.
      - name: Prompt caching check
        run: pnpm cache-check

      # The token ledger and the rate card (issue #53). Its headline failure is
      # the quietest in the repo: reading `inputTokens.total` instead of
      # `.noCache` double-bills every cached prompt token, producing a cost
      # report that is plausible, too high, and impossible to falsify by
      # looking. It also pins the surface list against the NEWEST migration that
      # declares ai_usage's `surface` CHECK constraint, and refuses a model with
      # no price (which would otherwise make the whole bill appear to fall).
      - name: Cost ledger check
        run: pnpm cost-check

      # The trial hand-off to Stripe (issue #85). Pure, credential-free, and
      # the bug it guards is invisible until a real manager subscribes near the
      # end of their trial: Stripe rejects an entire Checkout Session whose
      # trial_end is nearer than 48 hours, so they get an error instead of a
      # payment page. Nothing in the type system prevents it — trial_end is
      # just a number.
      - name: Billing trial check
        run: pnpm billing-check

      # The gate between the nightly memory review's model output and the
      # database (issue #48). Everything that gets through is injected into every
      # future system prompt for that company and is never re-checked, so a
      # defect here is not a wrong answer once — it is a wrong answer for ever,
      # at a cost per message, with no error anywhere. Covers the name guard
      # (issue #62's failure, re-armed for memories), deduplication against both
      # history and the run itself, and the per-run write cap.
      - name: Memory consolidation check
        run: pnpm memory-check

      # The design contract: every colour pair's WCAG contrast ratio, computed
      # from packages/ui/src/tokens.css itself, plus the ban on raw palette
      # classes outside the shrinking ledger. Credential-free, so it runs on
      # every PR. It exists because the primary button shipped at 3.56:1 and
      # nothing anywhere could notice.
      - name: Design system contract
        run: pnpm design-check

      # The activity feed's pure half (Rounds 2/3 of the design handoff). It
      # exists because the SAME events render on two surfaces — the Atividade
      # tab and Home's "what just happened" widget — and the whole design
      # depends on those two never describing one event differently. It also
      # pins the Lisbon-vs-UTC day boundary: 23:30Z in August is already
      # tomorrow in Lisbon, so labelling a row from the UTC date files it under
      # the wrong day. Same class of bug as the cron hour gate, and equally
      # invisible. Credential-free, so it runs on every PR.
      - name: Activity feed check
        run: pnpm activity-check

      # The one phone normalizer. Its failure mode is the quietest in the
      # product: a number stored in a shape WhatsApp does not use raises no
      # error anywhere, it simply means that person receives nothing and is
      # heard by nobody, while every screen goes on showing their number as if
      # it were fine. That is the 2026-08-12 incident, and Argentina (the 9 that
      # WhatsApp inserts and nobody in Argentina writes) is where it lives.
      # Pure, so it runs on every PR.
      - name: Phone normalizer check
        run: pnpm phone-check

      # The initial setup conversation (migration 0046). It exists because the
      # failure it guards is completely silent: a manager was greeted, given one
      # obra, told "done", and left with an empty company, and nothing anywhere
      # recorded that anything had gone wrong. This pins the checklist for every
      # state of a half-built company, in all three languages, and pins that the
      # tool which declares the setup finished reads the same rule the prompt
      # does. Credential-free, so it runs on every PR.
      - name: Onboarding check
        run: pnpm onboarding-check

      # The two account emails Capo now sends itself through Resend (W1). Both
      # failures they guard are silent: a mangled link means the one email a new
      # manager MUST open leads nowhere, and a dropped language means the only
      # person who notices is the one who cannot read the message. Rendering is
      # pure, so no credentials.
      - name: Account email check
        run: pnpm email-check

      # The no-photo waiver (0049): the rule that decides when a crew member may
      # finish a task without a photo. Every way it can be wrong is silent — too
      # loose and the mandatory-proof requirement quietly stops existing, too
      # strict and a worker with no way to photograph anything is refused
      # forever. Pure decision function, so no credentials.
      - name: No-photo waiver check
        run: pnpm waiver-check
